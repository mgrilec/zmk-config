name: 'Build temper'
on: workflow_dispatch
jobs:
  left:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["temper_left nice_view_adapter nice_view"]'
      alphas: '["QWERTY"]'
      branches: '["zmkfirmware/zmk/v0.3.0"]'
      snippet: studio-rpc-usb-uart
      kconfig: '["CONFIG_ZMK_STUDIO=y\nCONFIG_ZMK_STUDIO_LOCKING=y"]'
  right:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["temper_right nice_view_adapter nice_view"]'
      alphas: '["QWERTY"]'
      branches: '["zmkfirmware/zmk/v0.3.0"]'

